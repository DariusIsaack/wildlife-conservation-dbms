<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">
    <title>Edit Animal</title>
</head>
<body>
<header>
    <h1>Edit Animal</h1>
</header>

<div class="container">

    <div class ="card">
        <form method="POST">

    <input type="text" name="species" value="{{ animal[1] }}" required>
    <br><br>

    <input type="text" name="tag_id" value="{{ animal[2] }}" required>
    <br><br>

    <input type="number" name="age" value="{{ animal[3] }}" required>
    <br><br>

    <input type="text" name="health_status" value="{{ animal[4] }}" required>
    <br><br>

    <input type="number" name="habitat_id" value="{{ animal[5] }}" required>
    <br><br>

    <button type="submit">Update Animal</button>

</form>

<br>
<a href="/animals">Back</a>
    </div>
</div>

</body>
</html>
