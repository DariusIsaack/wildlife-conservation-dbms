<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">
    <title>Edit Habitat</title>
</head>
<body>

<header>
    <h1>Edit Habitat</h1>
</header>

<div class="container">

    <div class="card">
        <form method="POST">

    <input type="text" name="name" value="{{ habitat[1] }}" required>
    <br><br>

    <input type="text" name="location" value="{{ habitat[2] }}" required>
    <br><br>

    <input type="text" name="type" value="{{ habitat[3] }}" required>
    <br><br>

    <button type="submit">Update Habitat</button>

</form>

<br>
<a href="/habitats">Back</a>
    </div>
</div>



</body>
</html>
