<!DOCTYPE html>
<html>
<head>
    <title>Wildlife Login</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

    <style>

        .login-container {
            width: 400px;
            margin: 100px auto;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0px 3px 12px rgba(0,0,0,0.15);
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .login-card input {
            width: 95%;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
        }

        .logo {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: gray;
            margin-bottom: 20px;
        }

    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            🐾
        </div>

        <h2>Wildlife Conservation System</h2>

        <p class="subtitle">
            Login to continue
        </p>

        <form method="POST">

            <input type="text"
                   name="username"
                   placeholder="Username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button type="submit"
                    class="login-btn">
                Login
            </button>

        </form>

    </div>

</div>

</body>
</html>
