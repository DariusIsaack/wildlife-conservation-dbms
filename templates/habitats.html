<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">
    <title>Habitats</title>
</head>
<body>
<header>
<h1>Habitat Management</h1>
</header>

<div class="container">

    <div class="card">
        <form method="POST" action="/add_habitat">
    <input type="text" name="name" placeholder="Habitat Name" required>
    <br><br>

    <input type="text" name="location" placeholder="Location" required>
    <br><br>

    <input type="text" name="type" placeholder="Type" required>
    <br><br>

    <button type="submit">Add Habitat</button>
</form>

<hr>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Location</th>
        <th>Type</th>
        <th>Action</th>
    </tr>

    {% for habitat in habitats %}
    <tr>
        <td>{{ habitat[0] }}</td>
        <td>{{ habitat[1] }}</td>
        <td>{{ habitat[2] }}</td>
        <td>{{ habitat[3] }}</td>
        <td>
            <a href="/edit_habitat/{{ habitat[0] }}">Edit</a>
            <a href="/delete_habitat/{{ habitat[0] }}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

<br>
<a href="/dashboard">Back to Dashboard</a>
    </div>
</div>

</body>
</html>
